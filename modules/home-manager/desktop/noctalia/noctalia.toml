[notification]
background_opacity = 0.69999999999999996

[osd]
background_opacity = 0.69999999999999996

[shell]
avatar_path = "~/.face"
font_family = "JetBrainsMono Nerd Font"
screen_time_enabled = true
settings_show_advanced = true

    [shell.panel]
    control_center_placement = "centered"
    launcher_categories = false
    launcher_compact = true
    session_placement = "centered"
    wallpaper_placement = "centered"

[theme]
builtin = "Catppuccin"
custom_palette = "stylix"
mode = "dark"
source = "custom"

[wallpaper]
directory = "~/Pictures/Wallpapers"

    [wallpaper.default]
    path = "/home/tyron/Pictures/Wallpapers/default.png"

    [wallpaper.last]
    path = "/home/tyron/Pictures/Wallpapers/default.png"

    [wallpaper.monitors.DP-2]
    path = "/home/tyron/Pictures/Wallpapers/default.png"

[weather]
address = "Vienna"

[widget.cpu]
show_label = false

[widget.ram]
show_label = false

[widget.temp]
show_label = false
